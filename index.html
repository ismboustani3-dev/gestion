<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard Pro UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Inter', sans-serif;
}

body{
  background: #0a0f1c;
  color:white;
}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#111827,#0a0f1c);
}

.login-box{
  width:340px;
  padding:30px;
  border-radius:16px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.1);
}

.login-box h2{
  margin-bottom:20px;
}

input, button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

input{
  background:#111827;
  color:white;
}

button{
  background: linear-gradient(135deg,#38bdf8,#6366f1);
  color:white;
  cursor:pointer;
  font-weight:bold;
}

/* APP LAYOUT */
#app{
  display:none;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:240px;
  height:100%;
  background: rgba(17,24,39,0.9);
  backdrop-filter: blur(10px);
  padding:20px;
  border-right:1px solid rgba(255,255,255,0.05);
}

.logo{
  font-size:20px;
  font-weight:700;
  margin-bottom:30px;
  color:#38bdf8;
}

.nav a{
  display:block;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  color:white;
  text-decoration:none;
  cursor:pointer;
  transition:0.3s;
}

.nav a:hover{
  background:#1f2937;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.topbar h2{
  font-size:22px;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:20px;
  border-radius:16px;
  backdrop-filter: blur(10px);
  transition:0.3s;
}

.card:hover{
  transform: translateY(-5px);
}

/* HIDE SECTIONS */
.section{ display:none; }

/* ACTIVE */
.active{ display:block; }

.small{
  color:#94a3b8;
  margin-top:5px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
  <div class="login-box">
    <h2>👑 Admin Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">⚡ AdminPro</div>

    <div class="nav">
      <a onclick="show('dashboard')">📊 Dashboard</a>
      <a onclick="show('users')">👤 Users</a>
      <a onclick="show('projects')">📁 Projects</a>
      <a onclick="show('settings')">⚙ Settings</a>
      <a onclick="logout()">🚪 Logout</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- DASHBOARD -->
    <div id="dashboard" class="section active">
      <div class="topbar">
        <h2>Dashboard</h2>
      </div>

      <div class="grid">
        <div class="card">
          👤 Users
          <h2 id="userCount">0</h2>
          <div class="small">Total registered users</div>
        </div>

        <div class="card">
          📁 Projects
          <h2 id="projectCount">0</h2>
          <div class="small">Active projects</div>
        </div>
      </div>
    </div>

    <!-- USERS -->
    <div id="users" class="section">
      <h2>Users</h2>
      <div id="userList"></div>
    </div>

    <!-- PROJECTS -->
    <div id="projects" class="section">
      <h2>Projects</h2>
      <div id="projectList"></div>
    </div>

    <!-- SETTINGS -->
    <div id="settings" class="section">
      <h2>Settings</h2>

      <div class="card">
        <h3>Change Password</h3>
        <input id="newPass" placeholder="New password">
        <button onclick="changePass()">Update</button>
      </div>
    </div>

  </div>
</div>

<script>

/* INIT */
if(!localStorage.getItem("adminPass")){
  localStorage.setItem("adminPass","admin123");
}

if(!localStorage.getItem("users")){
  localStorage.setItem("users", JSON.stringify(["user1","user2","user3"]));
}

if(!localStorage.getItem("projects")){
  localStorage.setItem("projects", JSON.stringify(["project A","project B"]));
}

/* LOGIN */
function login(){
  let u=document.getElementById("user").value;
  let p=document.getElementById("pass").value;

  if(u==="admin" && p===localStorage.getItem("adminPass")){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("app").style.display="block";
    show("dashboard");
  } else {
    alert("Wrong login");
  }
}

/* NAV */
function show(page){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(page).classList.add("active");

  if(page==="dashboard") updateStats();
  if(page==="users") loadUsers();
  if(page==="projects") loadProjects();
}

/* STATS */
function updateStats(){
  let users = JSON.parse(localStorage.getItem("users"));
  let projects = JSON.parse(localStorage.getItem("projects"));

  document.getElementById("userCount").innerText = users.length;
  document.getElementById("projectCount").innerText = projects.length;
}

/* USERS */
function loadUsers(){
  let users = JSON.parse(localStorage.getItem("users"));
  document.getElementById("userList").innerHTML =
    users.map(u=>`<div class="card">👤 ${u}</div>`).join("");
}

/* PROJECTS */
function loadProjects(){
  let projects = JSON.parse(localStorage.getItem("projects"));
  document.getElementById("projectList").innerHTML =
    projects.map(p=>`<div class="card">📁 ${p}</div>`).join("");
}

/* SETTINGS */
function changePass(){
  localStorage.setItem("adminPass", document.getElementById("newPass").value);
  alert("Password updated!");
}

/* LOGOUT */
function logout(){
  document.getElementById("app").style.display="none";
  document.getElementById("loginPage").style.display="flex";
}

</script>

</body>
</html>
