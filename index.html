<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin System Fixed</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#1e293b;
  padding:30px;
  border-radius:12px;
  width:300px;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

input{
  background:#111827;
  color:white;
}

button{
  background:#38bdf8;
  cursor:pointer;
}

/* APP */
#app{ display:none; }

.navbar{
  display:flex;
  justify-content:space-between;
  background:#111827;
  padding:10px;
}

.navbar a{
  color:white;
  margin:0 10px;
  cursor:pointer;
}

.container{
  padding:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
  <div class="box">
    <h2>🔐 Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div class="navbar">
    <div>
      <a onclick="show('dashboard')">Dashboard</a>
      <a onclick="show('users')">Users</a>
      <a onclick="show('settings')">Settings</a>
    </div>
    <div>
      <a onclick="logout()">Logout</a>
    </div>
  </div>

  <div class="container">

    <!-- DASHBOARD -->
    <div id="dashboard">
      <h2>📊 Dashboard</h2>
      <div class="card">Users: <span id="userCount"></span></div>
    </div>

    <!-- USERS -->
    <div id="users" style="display:none">
      <h2>👤 Users</h2>
      <div class="card" id="userList"></div>
    </div>

    <!-- SETTINGS -->
    <div id="settings" style="display:none">
      <h2>⚙ Change Password</h2>

      <div class="card">
        <input id="newPass" placeholder="New password">
        <button onclick="changePassword()">Update</button>
      </div>
    </div>

  </div>
</div>

<script>

/* 🔥 INIT SAFE (FIX VERCEL ISSUE) */
function init(){
  let users = JSON.parse(localStorage.getItem("users"));

  if(!users){
    users = [
      {username:"admin", password:"admin123", role:"admin"},
      {username:"user1", password:"1234", role:"user"}
    ];
    localStorage.setItem("users", JSON.stringify(users));
  }
}

init();

/* 🔐 LOGIN */
function login(){
  let u = document.getElementById("user").value.trim();
  let p = document.getElementById("pass").value.trim();

  let users = JSON.parse(localStorage.getItem("users"));

  let found = users.find(x => x.username === u && x.password === p);

  if(found){
    localStorage.setItem("currentUser", JSON.stringify(found));

    document.getElementById("loginPage").style.display="none";
    document.getElementById("app").style.display="block";

    show("dashboard");
    updateStats();
  } else {
    alert("Wrong credentials");
  }
}

/* NAV */
function show(page){
  document.getElementById("dashboard").style.display="none";
  document.getElementById("users").style.display="none";
  document.getElementById("settings").style.display="none";

  document.getElementById(page).style.display="block";

  if(page==="users") loadUsers();
  if(page==="dashboard") updateStats();
}

/* STATS */
function updateStats(){
  let users = JSON.parse(localStorage.getItem("users"));
  document.getElementById("userCount").innerText = users.length;
}

/* USERS LIST */
function loadUsers(){
  let users = JSON.parse(localStorage.getItem("users"));

  document.getElementById("userList").innerHTML =
    users.map(u=>`
      <div class="card">
        👤 ${u.username} (${u.role})
      </div>
    `).join("");
}

/* 🔥 FIXED PASSWORD CHANGE (IMPORTANT) */
function changePassword(){
  let newPass = document.getElementById("newPass").value.trim();

  if(!newPass) return alert("Enter password");

  let currentUser = JSON.parse(localStorage.getItem("currentUser"));
  let users = JSON.parse(localStorage.getItem("users"));

  users = users.map(u=>{
    if(u.username === currentUser.username){
      return {...u, password:newPass};
    }
    return u;
  });

  localStorage.setItem("users", JSON.stringify(users));

  // update current session too (IMPORTANT FIX)
  currentUser.password = newPass;
  localStorage.setItem("currentUser", JSON.stringify(currentUser));

  alert("Password updated successfully!");
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("currentUser");

  document.getElementById("app").style.display="none";
  document.getElementById("loginPage").style.display="flex";
}

</script>

</body>
</html>
