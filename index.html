<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard Fixed</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#1e293b;
  padding:30px;
  border-radius:12px;
  width:300px;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

input{
  background:#111827;
  color:white;
}

button{
  background:#38bdf8;
  cursor:pointer;
}

/* APP */
#app{ display:none; }

.nav{
  display:flex;
  justify-content:space-between;
  background:#111827;
  padding:10px;
}

.nav a{
  color:white;
  margin:0 10px;
  cursor:pointer;
}

.container{
  padding:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
  <div class="box">
    <h2>🔐 Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div class="nav">
    <div>
      <a onclick="show('dashboard')">Dashboard</a>
      <a onclick="show('users')">Users</a>
      <a onclick="show('projects')">Projects</a>
    </div>
    <div>
      <a onclick="logout()">Logout</a>
    </div>
  </div>

  <div class="container">

    <div id="dashboard">
      <h2>📊 Dashboard</h2>
      <div class="card">Users: <span id="userCount"></span></div>
      <div class="card">Projects: <span id="projectCount"></span></div>
    </div>

    <div id="users" style="display:none">
      <h2>Users</h2>
      <div class="card" id="userList"></div>
    </div>

    <div id="projects" style="display:none">
      <h2>Projects</h2>
      <div class="card" id="projectList"></div>
    </div>

  </div>
</div>

<script>

/* 🔥 INIT FIX (IMPORTANT FOR VERCEL) */
function init(){
  let users = JSON.parse(localStorage.getItem("users"));

  if(!users || users.length === 0){
    users = [
      {username:"admin", password:"admin123", role:"admin"},
      {username:"user1", password:"1234", role:"user"}
    ];
    localStorage.setItem("users", JSON.stringify(users));
  }

  let projects = JSON.parse(localStorage.getItem("projects"));
  if(!projects || projects.length === 0){
    projects = ["Project A","Project B"];
    localStorage.setItem("projects", JSON.stringify(projects));
  }
}

init();

/* 🔐 LOGIN */
function login(){
  let u = document.getElementById("user").value.trim();
  let p = document.getElementById("pass").value.trim();

  let users = JSON.parse(localStorage.getItem("users"));

  let found = users.find(x => x.username === u && x.password === p);

  if(found){
    localStorage.setItem("currentUser", JSON.stringify(found));

    document.getElementById("loginPage").style.display="none";
    document.getElementById("app").style.display="block";

    show("dashboard");
    updateStats();
  } else {
    alert("Wrong credentials");
  }
}

/* NAV */
function show(page){
  document.getElementById("dashboard").style.display="none";
  document.getElementById("users").style.display="none";
  document.getElementById("projects").style.display="none";

  document.getElementById(page).style.display="block";

  if(page==="users") loadUsers();
  if(page==="projects") loadProjects();
  if(page==="dashboard") updateStats();
}

/* STATS */
function updateStats(){
  let users = JSON.parse(localStorage.getItem("users"));
  let projects = JSON.parse(localStorage.getItem("projects"));

  document.getElementById("userCount").innerText = users.length;
  document.getElementById("projectCount").innerText = projects.length;
}

/* USERS */
function loadUsers(){
  let users = JSON.parse(localStorage.getItem("users"));

  document.getElementById("userList").innerHTML =
    users.map(u => `
      <div class="card">
        👤 ${u.username} (${u.role})
      </div>
    `).join("");
}

/* PROJECTS */
function loadProjects(){
  let projects = JSON.parse(localStorage.getItem("projects"));

  document.getElementById("projectList").innerHTML =
    projects.map(p => `
      <div class="card">📁 ${p}</div>
    `).join("");
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("currentUser");

  document.getElementById("app").style.display="none";
  document.getElementById("loginPage").style.display="flex";
}

</script>

</body>
</html>
