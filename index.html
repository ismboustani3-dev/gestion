<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Admin System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Inter, sans-serif;
}

body{
  background:#0a0f1c;
  color:white;
}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:340px;
  padding:30px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  backdrop-filter: blur(10px);
}

input, button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  outline:none;
}

input{
  background:#111827;
  color:white;
}

button{
  background:linear-gradient(135deg,#38bdf8,#6366f1);
  color:white;
  cursor:pointer;
  font-weight:600;
}

/* APP */
#app{ display:none; }

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:240px;
  height:100%;
  background:rgba(17,24,39,0.9);
  padding:20px;
  border-right:1px solid rgba(255,255,255,0.05);
}

.logo{
  color:#38bdf8;
  font-weight:700;
  font-size:20px;
  margin-bottom:20px;
}

.sidebar a{
  display:block;
  padding:10px;
  margin:5px 0;
  color:white;
  text-decoration:none;
  cursor:pointer;
  border-radius:8px;
}

.sidebar a:hover{
  background:#1f2937;
}

.main{
  margin-left:240px;
  padding:20px;
}

.section{ display:none; }
.active{ display:block; }

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.08);
}

h2{ margin-bottom:15px; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
  <div class="box">
    <h2>🔐 Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">⚡ AdminPro</div>

    <a onclick="show('dashboard')">📊 Dashboard</a>
    <a onclick="show('users')">👤 Users</a>
    <a onclick="show('projects')">📁 Projects</a>
    <a onclick="show('settings')">⚙ Settings</a>
    <a onclick="logout()">🚪 Logout</a>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- DASHBOARD -->
    <div id="dashboard" class="section active">
      <h2>Dashboard</h2>

      <div class="grid">
        <div class="card">
          👤 Users
          <h2 id="userCount">0</h2>
        </div>

        <div class="card">
          📁 Projects
          <h2 id="projectCount">0</h2>
        </div>
      </div>
    </div>

    <!-- USERS -->
    <div id="users" class="section">
      <h2>User Management</h2>

      <div class="card">
        <input id="newUser" placeholder="username">
        <input id="newPass" placeholder="password">
        <button onclick="addUser()">Create User</button>
      </div>

      <div id="userList"></div>
    </div>

    <!-- PROJECTS -->
    <div id="projects" class="section">
      <h2>Projects</h2>
      <div id="projectList"></div>
    </div>

    <!-- SETTINGS -->
    <div id="settings" class="section">
      <h2>Settings</h2>

      <div class="card">
        <input id="changePass" placeholder="new password">
        <button onclick="updatePassword()">Update Password</button>
      </div>
    </div>

  </div>
</div>

<script>

/* INIT DATA */
if(!localStorage.getItem("users")){
  localStorage.setItem("users", JSON.stringify([
    {username:"admin", password:"admin123", role:"admin"},
    {username:"user1", password:"1234", role:"user"}
  ]));
}

if(!localStorage.getItem("projects")){
  localStorage.setItem("projects", JSON.stringify([
    "Project A",
    "Project B"
  ]));
}

/* LOGIN */
function login(){
  let u=document.getElementById("user").value;
  let p=document.getElementById("pass").value;

  let users=JSON.parse(localStorage.getItem("users"));

  let found = users.find(x=>x.username===u && x.password===p);

  if(found){
    localStorage.setItem("currentUser", JSON.stringify(found));

    document.getElementById("loginPage").style.display="none";
    document.getElementById("app").style.display="block";

    show("dashboard");
  } else {
    alert("Wrong credentials");
  }
}

/* NAV */
function show(page){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(page).classList.add("active");

  if(page==="dashboard") updateStats();
  if(page==="users") loadUsers();
  if(page==="projects") loadProjects();
}

/* STATS */
function updateStats(){
  let users=JSON.parse(localStorage.getItem("users"));
  let projects=JSON.parse(localStorage.getItem("projects"));

  document.getElementById("userCount").innerText=users.length;
  document.getElementById("projectCount").innerText=projects.length;
}

/* USERS */
function addUser(){
  let cu=JSON.parse(localStorage.getItem("currentUser"));
  if(!cu || cu.role!=="admin") return alert("Admin only");

  let username=document.getElementById("newUser").value;
  let password=document.getElementById("newPass").value;

  let users=JSON.parse(localStorage.getItem("users"));

  users.push({username,password,role:"user"});

  localStorage.setItem("users",JSON.stringify(users));

  loadUsers();
  updateStats();
}

function loadUsers(){
  let users=JSON.parse(localStorage.getItem("users"));

  document.getElementById("userList").innerHTML=
    users.map(u=>`
      <div class="card">
        👤 ${u.username} - ${u.role}
      </div>
    `).join("");
}

/* PROJECTS */
function loadProjects(){
  let projects=JSON.parse(localStorage.getItem("projects"));

  document.getElementById("projectList").innerHTML=
    projects.map(p=>`
      <div class="card">📁 ${p}</div>
    `).join("");
}

/* SETTINGS */
function updatePassword(){
  let newPass=document.getElementById("changePass").value;

  let cu=JSON.parse(localStorage.getItem("currentUser"));

  let users=JSON.parse(localStorage.getItem("users"));

  users=users.map(u=>{
    if(u.username===cu.username){
      u.password=newPass;
    }
    return u;
  });

  localStorage.setItem("users",JSON.stringify(users));
  alert("Password updated");
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("currentUser");

  document.getElementById("app").style.display="none";
  document.getElementById("loginPage").style.display="flex";
}

</script>

</body>
</html>
