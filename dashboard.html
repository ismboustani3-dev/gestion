<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects Per User</title>

<style>
body{
  background:#0b1220;
  color:white;
  font-family:Segoe UI;
  padding:20px;
}

input{
  padding:10px;
  margin:5px 0;
  width:100%;
  border:none;
  border-radius:8px;
  background:#111827;
  color:white;
}

button{
  padding:10px;
  background:#2563eb;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.table{
  background:#111827;
  margin-top:20px;
  padding:15px;
  border-radius:10px;
}

.card{
  background:#0f172a;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
}

a{
  color:#38bdf8;
  text-decoration:none;
}
</style>
</head>

<body>

<h2>Login (simple username)</h2>

<input id="user" placeholder="enter username">
<button onclick="login()">Enter</button>

<hr>

<h2>Add Project</h2>

<input id="object" placeholder="project name">
<input id="link" placeholder="project link">
<button onclick="addProject()">Add</button>

<hr>

<div id="tables"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = "";

/* LOGIN */
window.login = function(){
  if(user.value=="") return;

  currentUser = user.value;

  alert("Logged as " + currentUser);
};

/* ADD PROJECT */
window.addProject = async function(){

  if(currentUser=="" || object.value=="" || link.value=="") return;

  await addDoc(collection(db,"projects"),{
    username: currentUser,
    object: object.value,
    link: link.value
  });

  object.value="";
  link.value="";
};

/* LOAD + GROUP */
function load(){

  onSnapshot(collection(db,"projects"),snap=>{

    let groups = {};

    snap.forEach(d=>{
      let p = d.data();

      if(!groups[p.username]){
        groups[p.username] = [];
      }

      groups[p.username].push(p);
    });

    render(groups);

  });
}

/* RENDER TABLES */
function render(data){

  tables.innerHTML="";

  for(let user in data){

    // show ONLY current user
    if(user !== currentUser) continue;

    let html = `
      <div class="table">
        <h3>👤 ${user}</h3>
    `;

    data[user].forEach(p=>{
      html += `
        <div class="card">
          🧠 ${p.object}<br>
          🔗 <a href="${p.link}" target="_blank">Open</a>
        </div>
      `;
    });

    html += `</div>`;

    tables.innerHTML += html;
  }
}

load();

</script>

</body>
</html>
