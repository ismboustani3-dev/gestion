<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TeamDash Simple</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{background:#0b1220;color:white;display:flex}

/* SIDEBAR */
.sidebar{
  width:240px;height:100vh;background:#0f172a;
  padding:20px;position:fixed;
}
.menu div{
  padding:12px;margin:8px 0;border-radius:10px;
  cursor:pointer;color:#9ca3af;
}
.menu div:hover{background:#1f2937;color:white}
.menu .active{background:#2563eb;color:white}

/* MAIN */
.main{margin-left:240px;padding:20px;width:100%}

/* BOX */
.box{
  background:#111827;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
}

/* INPUT */
input{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}
button{
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* LIST */
.item{
  padding:10px;
  border-bottom:1px solid #1f2937;
}

/* SECTIONS */
.section{display:none}
.section.active{display:block}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>TeamDash</h2>

  <div class="menu">
    <div onclick="show('dashboard')" class="active">📊 Dashboard</div>
    <div onclick="show('users')">👥 Users</div>
    <div onclick="show('projects')">📁 Projects</div>
  </div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <h2>Dashboard</h2>

  <div class="box">
    <h3>System Overview</h3>
    <canvas id="chart"></canvas>
  </div>
</div>

<!-- USERS -->
<div id="users" class="section">
  <h2>Users</h2>

  <div class="box">
    <input id="userName" placeholder="username">
    <button onclick="addUser()">Add User</button>

    <div id="userList"></div>
  </div>
</div>

<!-- PROJECTS -->
<div id="projects" class="section">
  <h2>Projects</h2>

  <div class="box">
    <input id="projectName" placeholder="project name">
    <button onclick="addProject()">Add Project</button>

    <div id="projectList"></div>
  </div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* NAV */
window.show = function(page){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(page).classList.add("active");
};

/* USERS */
window.addUser = async function(){
  if(userName.value==="") return;

  await addDoc(collection(db,"users"),{
    name:userName.value
  });

  userName.value="";
};

window.deleteUser = async function(id){
  await deleteDoc(doc(db,"users",id));
};

function loadUsers(){
  onSnapshot(collection(db,"users"),snap=>{
    userList.innerHTML="";
    snap.forEach(d=>{
      userList.innerHTML+=`
        <div class="item">
          ${d.data().name}
          <button onclick="deleteUser('${d.id}')">X</button>
        </div>
      `;
    });
  });
}

/* PROJECTS */
window.addProject = async function(){
  if(projectName.value==="") return;

  await addDoc(collection(db,"projects"),{
    name:projectName.value
  });

  projectName.value="";
};

window.deleteProject = async function(id){
  await deleteDoc(doc(db,"projects",id));
};

function loadProjects(){
  onSnapshot(collection(db,"projects"),snap=>{
    projectList.innerHTML="";
    snap.forEach(d=>{
      projectList.innerHTML+=`
        <div class="item">
          ${d.data().name}
          <button onclick="deleteProject('${d.id}')">X</button>
        </div>
      `;
    });
  });
}

/* SIMPLE CHART */
new Chart(document.getElementById("chart"),{
  type:"bar",
  data:{
    labels:["Users","Projects"],
    datasets:[{data:[0,0]}]
  }
});

/* INIT */
loadUsers();
loadProjects();

</script>

</body>
</html>
