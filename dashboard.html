<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure TeamDash</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{background:#0b1220;color:white}

/* LOGIN */
#login{
  position:fixed;
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b1220;
}

.box{
  background:#111827;
  padding:30px;
  border-radius:12px;
  text-align:center;
}

/* APP */
#app{display:none}

/* SIDEBAR */
.sidebar{
  width:240px;height:100vh;background:#0f172a;
  position:fixed;padding:20px;
}

.menu div{
  padding:12px;margin:8px 0;border-radius:10px;
  cursor:pointer;color:#9ca3af;
}
.menu div:hover{background:#1f2937;color:white}

/* MAIN */
.main{margin-left:240px;padding:20px}

/* BOX */
.card,.box2{
  background:#111827;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
}

/* INPUT */
input{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* LIST */
.item{
  padding:10px;
  border-bottom:1px solid #1f2937;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="login">
  <div class="box">
    <h2>Login</h2>
    <input id="loginUser" placeholder="Username"><br>
    <input id="loginPass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- 📊 APP -->
<div id="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>TeamDash</h2>

  <div class="menu">
    <div onclick="show('dashboard')">📊 Dashboard</div>
    <div onclick="show('users')">👥 Users</div>
    <div onclick="show('projects')">📁 Projects</div>
    <div onclick="logout()">🚪 Logout</div>
  </div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">
  <h2>Dashboard</h2>

  <div class="card">
    <h3>My Projects</h3>
    <h1 id="count">0</h1>
  </div>

  <div class="box2">
    <canvas id="chart"></canvas>
  </div>
</div>

<!-- USERS -->
<div id="users" style="display:none">
  <h2>Create User</h2>

  <input id="uUser" placeholder="username">
  <input id="uPass" placeholder="password" type="password">
  <button onclick="addUser()">Create</button>
</div>

<!-- PROJECTS -->
<div id="projects" style="display:none">
  <h2>Projects</h2>

  <input id="pName" placeholder="project name">
  <button onclick="addProject()">Add</button>

  <div id="list"></div>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔴 CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* GLOBAL */
let currentUser = null;
let chart;

/* 🔐 LOGIN SAFE CHECK */
window.login = async function(){

  let u = loginUser.value;
  let p = loginPass.value;

  const snap = await getDocs(collection(db,"users"));

  let ok = false;

  snap.forEach(d=>{
    let data = d.data();

    if(data.username === u && data.password === p){
      ok = true;
      currentUser = u;
    }
  });

  if(ok){
    login.style.display="none";
    app.style.display="block";
    loadProjects();
  }else{
    alert("Wrong username or password ❌");
  }
};

/* 🚪 LOGOUT */
window.logout = function(){
  location.reload();
};

/* NAV */
window.show = function(page){
  dashboard.style.display="none";
  users.style.display="none";
  projects.style.display="none";

  document.getElementById(page).style.display="block";
};

/* 👤 CREATE USER */
window.addUser = async function(){

  await addDoc(collection(db,"users"),{
    username: uUser.value,
    password: uPass.value
  });

  alert("User created ✅");
};

/* 📁 ADD PROJECT */
window.addProject = async function(){

  await addDoc(collection(db,"projects"),{
    name: pName.value,
    owner: currentUser
  });

  pName.value="";
};

/* 📁 LOAD PROJECTS */
function loadProjects(){

  onSnapshot(collection(db,"projects"),snap=>{

    list.innerHTML="";
    let count=0;

    snap.forEach(d=>{
      let data=d.data();

      if(data.owner === currentUser){
        count++;
        list.innerHTML += `<div class="item">${data.name}</div>`;
      }
    });

    count.innerText = count;
    document.getElementById("count").innerText = count;

    updateChart(count);
  });
}

/* 📊 CHART */
chart = new Chart(document.getElementById("chart"),{
  type:"bar",
  data:{
    labels:["Projects"],
    datasets:[{data:[0]}]
  }
});

function updateChart(v){
  chart.data.datasets[0].data=[v];
  chart.update();
}

</script>

</body>
</html>
