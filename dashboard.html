<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TeamDash Multi User</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{background:#0b1220;color:white}

/* LOGIN */
#login{
  position:absolute;width:100%;height:100vh;
  display:flex;justify-content:center;align-items:center;
}
.login-box{background:#111827;padding:30px;border-radius:12px;text-align:center}

/* APP */
#app{display:none}

/* SIDEBAR */
.sidebar{
  width:240px;height:100vh;background:#0f172a;
  padding:20px;position:fixed;
}
.menu div{padding:12px;margin:8px 0;border-radius:10px;cursor:pointer;color:#9ca3af}
.menu div:hover{background:#1f2937;color:white}
.menu .active{background:#2563eb;color:white}

.main{margin-left:240px;padding:20px}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.card{background:#111827;padding:20px;border-radius:12px}

/* BOX */
.box{background:#111827;padding:20px;border-radius:12px;margin-top:20px}

/* INPUT */
input{padding:10px;margin:5px;border-radius:8px;border:none}
button{padding:10px;border:none;border-radius:8px;background:#2563eb;color:white;cursor:pointer}

/* LIST */
.item{padding:10px;border-bottom:1px solid #1f2937}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>Login</h2>
    <input id="loginUser" placeholder="Username"><br>
    <input id="loginPass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">

<div class="sidebar">
  <div class="menu">
    <div onclick="showPage('dashboard')">📊 Dashboard</div>
    <div onclick="showPage('users')">👥 Users</div>
    <div onclick="showPage('projects')">📁 Projects</div>
    <div onclick="logout()">🚪 Logout</div>
  </div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">
  <h2>Dashboard</h2>

  <div class="cards">
    <div class="card">
      <h3>My Projects</h3>
      <h1 id="projectCount">0</h1>
    </div>

    <div class="card">
      <h3>Status</h3>
      <h1>Online</h1>
    </div>
  </div>

  <div class="box">
    <canvas id="chart"></canvas>
  </div>
</div>

<!-- USERS -->
<div id="users" style="display:none">
  <h2>User Management</h2>

  <input id="userInput" placeholder="Username">
  <input id="passInput" type="password" placeholder="Password">
  <button onclick="addUser()">Create</button>
</div>

<!-- PROJECTS -->
<div id="projects" style="display:none">
  <h2>Projects</h2>

  <input id="projectInput" placeholder="Project name">
  <button onclick="addProject()">Add</button>

  <div id="projectList"></div>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, query, where, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;
let chart;

/* NAV */
window.showPage = function(p){
  document.getElementById("dashboard").style.display="none";
  document.getElementById("users").style.display="none";
  document.getElementById("projects").style.display="none";
  document.getElementById(p).style.display="block";
};

/* LOGIN */
window.login = async function(){
  let u = loginUser.value;
  let p = loginPass.value;

  const q = query(collection(db,"users"),
    where("username","==",u),
    where("password","==",p)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    alert("Wrong login ❌");
    return;
  }

  currentUser = u;

  login.style.display="none";
  app.style.display="block";

  loadProjects();
};

/* LOGOUT */
window.logout = function(){
  location.reload();
};

/* CREATE USER */
window.addUser = async function(){
  if(userInput.value=="" || passInput.value=="") return;

  await addDoc(collection(db,"users"),{
    username:userInput.value,
    password:passInput.value
  });

  alert("User created ✅");

  userInput.value="";
  passInput.value="";
};

/* PROJECTS */
window.addProject = async function(){
  if(projectInput.value=="") return;

  await addDoc(collection(db,"projects"),{
    name:projectInput.value,
    owner:currentUser
  });

  projectInput.value="";
};

function loadProjects(){
  onSnapshot(collection(db,"projects"),snap=>{
    projectList.innerHTML="";
    let count=0;

    snap.forEach(d=>{
      let data=d.data();

      if(data.owner===currentUser){
        count++;

        projectList.innerHTML+=`
          <div class="item">${data.name}</div>
        `;
      }
    });

    projectCount.innerText=count;
    updateChart(count);
  });
}

/* CHART */
function createChart(){
  chart = new Chart(document.getElementById("chart"),{
    type:'bar',
    data:{
      labels:['My Projects'],
      datasets:[{data:[0]}]
    }
  });
}

function updateChart(count){
  chart.data.datasets[0].data=[count];
  chart.update();
}

createChart();

</script>

</body>
</html>
