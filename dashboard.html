<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TeamDash UI</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI, sans-serif;
}

body{
  background:#0b1220;
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#0f172a;
  padding:20px;
  position:fixed;
}

.logo{
  font-size:22px;
  font-weight:bold;
  margin-bottom:30px;
}

.menu div{
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
  color:#9ca3af;
}

.menu div:hover{
  background:#1f2937;
  color:white;
}

.menu .active{
  background:#2563eb;
  color:white;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
  width:100%;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:#111827;
  padding:20px;
  border-radius:12px;
}

.card h3{
  color:#9ca3af;
  font-size:14px;
}

.card h1{
  margin-top:10px;
}

/* BOX */
.box{
  background:#111827;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}

/* SECTIONS */
.section{
  display:none;
}

.section.active{
  display:block;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">TeamDash</div>

  <div class="menu">
    <div class="active" onclick="showPage('dashboard')">📊 Dashboard</div>
    <div onclick="showPage('users')">👥 User Management</div>
    <div onclick="showPage('projects')">📁 Projects</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- DASHBOARD -->
  <div id="dashboard" class="section active">

    <h2>Dashboard</h2>

    <div class="cards">
      <div class="card">
        <h3>Total Users</h3>
        <h1>8</h1>
      </div>

      <div class="card">
        <h3>Total Projects</h3>
        <h1>3</h1>
      </div>

      <div class="card">
        <h3>Active Servers</h3>
        <h1>15</h1>
      </div>
    </div>

    <div class="box">
      <h3 style="margin-bottom:15px;">Statistics</h3>
      <canvas id="myChart"></canvas>
    </div>

  </div>

  <!-- USERS -->
  <div id="users" class="section">
    <h2>User Management</h2>

    <div class="box">
      <p>👤 user1 - admin</p>
      <p>👤 user2 - editor</p>
      <p>👤 user3 - viewer</p>
    </div>
  </div>

  <!-- PROJECTS -->
  <div id="projects" class="section">
    <h2>Projects</h2>

    <div class="box">
      <p>📁 Project A - Active</p>
      <p>📁 Project B - Pending</p>
      <p>📁 Project C - Completed</p>
    </div>
  </div>

</div>

<script>
function showPage(page){

  let sections = document.querySelectorAll(".section");
  sections.forEach(sec => sec.classList.remove("active"));

  document.getElementById(page).classList.add("active");

  // fix chart render when returning
  if(page === "dashboard"){
    setTimeout(loadChart, 100);
  }
}

let chartLoaded = false;

function loadChart(){
  if(chartLoaded) return;

  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Users', 'Projects'],
      datasets: [{
        label: 'System Stats',
        data: [8, 3],
        borderWidth: 1,
        backgroundColor: ['#3b82f6','#a855f7']
      }]
    },
    options: {
      plugins: {
        legend: {
          labels: { color: 'white' }
        }
      },
      scales: {
        x: {
          ticks: { color: 'white' }
        },
        y: {
          ticks: { color: 'white' }
        }
      }
    }
  });

  chartLoaded = true;
}

// load chart first time
loadChart();
</script>

</body>
</html>
