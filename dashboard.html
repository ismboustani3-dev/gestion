<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team System</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:#0b1220;
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#0f172a;
  padding:20px;
  position:fixed;
}

.logo{
  font-size:20px;
  font-weight:bold;
  margin-bottom:25px;
}

.menu div{
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
  color:#9ca3af;
}

.menu div:hover{
  background:#1f2937;
  color:white;
}

.menu .active{
  background:#2563eb;
  color:white;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
  width:100%;
}

/* BOX */
.box{
  background:#111827;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
  background:#0f172a;
  color:white;
}

button{
  padding:10px 15px;
  background:#2563eb;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

/* CARD */
.card{
  background:#0f172a;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}

/* SECTIONS */
.section{
  display:none;
}

.section.active{
  display:block;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">TEAM SYSTEM</div>

<div class="menu">
  <div class="active" onclick="show('dashboard')">📊 Dashboard</div>
  <div onclick="show('users')">👥 Users Management</div>
  <div onclick="show('projects')">📁 Projects</div>
  <div onclick="logout()">🚪 Logout</div>
</div>

</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <h2>Dashboard</h2>

  <div class="box">
    <h3>Welcome 👋</h3>
    <p>Simple Firebase Project System</p>
  </div>
</div>

<!-- USERS -->
<div id="users" class="section">
  <h2>User Management</h2>

  <div class="box">
    <input id="uName" placeholder="username">
    <button onclick="addUser()">Add User</button>

    <div id="userList"></div>
  </div>
</div>

<!-- PROJECTS -->
<div id="projects" class="section">
  <h2>Projects</h2>

  <div class="box">

    <input id="username" placeholder="username">
    <input id="object" placeholder="project name">
    <input id="link" placeholder="project link">

    <button onclick="addProject()">Add Project</button>

    <div id="list"></div>

  </div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* NAV */
window.show = function(page){

  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(page).classList.add("active");

};

/* LOGOUT */
window.logout = function(){
  location.reload();
};

/* USERS */
window.addUser = async function(){

  if(!uName.value) return;

  await addDoc(collection(db,"users"),{
    name:uName.value
  });

  uName.value="";
};

function loadUsers(){
  onSnapshot(collection(db,"users"),snap=>{
    userList.innerHTML="";

    snap.forEach(d=>{
      userList.innerHTML += `
        <div class="card">👤 ${d.data().name}</div>
      `;
    });
  });
}

/* PROJECTS */
window.addProject = async function(){

  if(username.value=="" || object.value=="" || link.value=="") return;

  await addDoc(collection(db,"projects"),{
    username:username.value,
    object:object.value,
    link:link.value
  });

  username.value="";
  object.value="";
  link.value="";
};

function loadProjects(){
  onSnapshot(collection(db,"projects"),snap=>{
    list.innerHTML="";

    snap.forEach(d=>{
      let data=d.data();

      list.innerHTML+=`
        <div class="card">
          👤 ${data.username}<br>
          🧠 ${data.object}<br>
          🔗 <a href="${data.link}" target="_blank" style="color:#38bdf8">Open</a>
        </div>
      `;
    });
  });
}

/* INIT */
loadUsers();
loadProjects();

</script>

</body>
</html>
