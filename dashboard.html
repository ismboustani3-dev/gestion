<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#e5e7eb;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100vh;
  background:#111827;
  color:white;
  padding:20px;
}

.sidebar h2{
  color:#38bdf8;
  margin-bottom:30px;
}

/* TOPBAR */

.topbar{
  position:fixed;
  left:220px;
  top:0;
  right:0;
  height:60px;
  background:white;
  border-bottom:1px solid #ccc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

#search{
  width:250px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

/* MAIN */

.main{
  margin-left:220px;
  margin-top:60px;
  padding:20px;
}

/* ADD BOX */

.addBox{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:25px;
}

.addBox h3{
  margin-bottom:15px;
}

.addBox input{
  padding:10px;
  margin:5px;
  border:1px solid #ccc;
  border-radius:8px;
}

.addBox button{
  padding:10px 20px;
  border:none;
  background:#38bdf8;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* LIST */

#list{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

/* USER BOX */

.userBox{
  width:200px;
  background:white;
  border:2px solid black;
  padding:10px;
}

/* USER */

.userTitle{
  font-weight:bold;
  margin-bottom:15px;
  border-bottom:1px solid #999;
  padding-bottom:5px;
}

/* PROJECT */

.projectItem{
  margin-bottom:15px;
  padding-bottom:10px;
  border-bottom:1px solid #ddd;
}

.projectName{
  margin-bottom:8px;
}

/* BUTTONS */

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.smallBtn{
  padding:5px 8px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-size:12px;
}

.openBtn{
  background:#38bdf8;
  color:white;
}

.editBtn{
  background:#facc15;
}

.deleteBtn{
  background:#ef4444;
  color:white;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <h2>⚡ Ultra Admin</h2>

</div>

<!-- TOPBAR -->

<div class="topbar">

  <input
    type="text"
    id="search"
    placeholder="Search..."
  >

  <div>
    👤 admin
  </div>

</div>

<!-- MAIN -->

<div class="main">

  <!-- ADD -->

  <div class="addBox">

    <h3>Add Project</h3>

    <input
      type="text"
      id="user"
      placeholder="Username"
    >

    <input
      type="text"
      id="name"
      placeholder="Project name"
    >

    <input
      type="text"
      id="link"
      placeholder="Project link"
    >

    <button onclick="addProject()">
      Add
    </button>

  </div>

  <!-- LIST -->

  <div id="list"></div>

</div>

<script>

/* GET */

function getProjects(){

  let data =
    localStorage.getItem("projects");

  if(data){

    return JSON.parse(data);

  }else{

    return [];

  }

}

/* SAVE */

function saveProjects(data){

  localStorage.setItem(
    "projects",
    JSON.stringify(data)
  );

}

/* ADD */

function addProject(){

  let user =
    document.getElementById("user").value;

  let name =
    document.getElementById("name").value;

  let link =
    document.getElementById("link").value;

  if(user === "" ||
     name === "" ||
     link === ""){

    alert("Fill all fields");

    return;

  }

  if(!link.startsWith("http")){

    link = "https://" + link;

  }

  let projects = getProjects();

  let newProject = {

    id: Date.now(),

    user: user,

    name: name,

    link: link

  };

  projects.push(newProject);

  saveProjects(projects);

  document.getElementById("user").value = "";
  document.getElementById("name").value = "";
  document.getElementById("link").value = "";

  renderProjects();

}

/* DELETE */

function deleteProject(id){

  let projects =
    getProjects().filter(
      p => p.id !== id
    );

  saveProjects(projects);

  renderProjects();

}

/* EDIT */

function editProject(id){

  let projects = getProjects();

  let project =
    projects.find(p => p.id === id);

  let newName =
    prompt(
      "Edit name",
      project.name
    );

  if(newName){

    project.name = newName;

  }

  let newLink =
    prompt(
      "Edit link",
      project.link
    );

  if(newLink){

    project.link = newLink;

  }

  saveProjects(projects);

  renderProjects();

}

/* RENDER */

function renderProjects(){

  let projects = getProjects();

  let search =
    document.getElementById("search")
    .value
    .toLowerCase();

  let filtered =
    projects.filter(p =>

      p.user.toLowerCase().includes(search)

      ||

      p.name.toLowerCase().includes(search)

    );

  let grouped = {};

  filtered.forEach(function(project){

    if(!grouped[project.user]){

      grouped[project.user] = [];

    }

    grouped[project.user].push(project);

  });

  let list =
    document.getElementById("list");

  list.innerHTML = "";

  for(let user in grouped){

    let html = "";

    grouped[user].forEach(function(project){

      html += `

        <div class="projectItem">

          <div class="projectName">

            ${project.name}

          </div>

          <div class="actions">

            <a
              href="${project.link}"
              target="_blank"
            >

              <button class="smallBtn openBtn">

                OPEN

              </button>

            </a>

            <button
              class="smallBtn editBtn"
              onclick="editProject(${project.id})"
            >

              Edit

            </button>

            <button
              class="smallBtn deleteBtn"
              onclick="deleteProject(${project.id})"
            >

              Delete

            </button>

          </div>

        </div>

      `;

    });

    list.innerHTML += `

      <div class="userBox">

        <div class="userTitle">

          ${user}

        </div>

        ${html}

      </div>

    `;

  }

}

/* SEARCH */

document
.getElementById("search")
.addEventListener(
  "input",
  renderProjects
);

/* START */

renderProjects();

</script>

</body>
</html>
