<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team System Pro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:#0b1220;
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#0f172a;
  padding:20px;
  position:fixed;
}

.menu div{
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
  color:#9ca3af;
}

.menu div:hover{
  background:#1f2937;
  color:white;
}

.menu .active{
  background:#2563eb;
  color:white;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
  width:100%;
}

/* BOX */
.box{
  background:#111827;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
  background:#0f172a;
  color:white;
}

button{
  padding:10px 15px;
  background:#2563eb;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

/* CARD */
.card{
  background:#0f172a;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>TEAM SYSTEM</h2>

  <div class="menu">
    <div onclick="UI.show('dashboard')">📊 Dashboard</div>
    <div onclick="UI.show('users')">👥 Users</div>
    <div onclick="UI.show('projects')">📁 Projects</div>
    <div onclick="App.logout()">🚪 Logout</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="section">
  <h2>Dashboard</h2>

  <div class="box">
    <p>System ready ✔️</p>
  </div>
</div>

<!-- USERS -->
<div id="users" class="section">
  <h2>User Management</h2>

  <div class="box">
    <input id="uName" placeholder="username">
    <button onclick="App.addUser()">Add User</button>

    <div id="userList"></div>
  </div>
</div>

<!-- PROJECTS -->
<div id="projects" class="section">
  <h2>Projects</h2>

  <div class="box">
    <input id="username" placeholder="username">
    <input id="object" placeholder="project name">
    <input id="link" placeholder="project link">

    <button onclick="App.addProject()">Add Project</button>

    <div id="projectList"></div>
  </div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* DOM CACHE */
const DOM = {
  userList: document.getElementById("userList"),
  projectList: document.getElementById("projectList"),
  uName: document.getElementById("uName"),
  username: document.getElementById("username"),
  object: document.getElementById("object"),
  link: document.getElementById("link"),
};

/* APP LOGIC */
const App = {

  /* USERS */
  addUser: async function(){
    if(!DOM.uName.value) return;

    await addDoc(collection(db,"users"),{
      name: DOM.uName.value
    });

    DOM.uName.value="";
  },

  /* PROJECTS */
  addProject: async function(){
    if(!DOM.username.value || !DOM.object.value || !DOM.link.value) return;

    await addDoc(collection(db,"projects"),{
      username: DOM.username.value,
      object: DOM.object.value,
      link: DOM.link.value
    });

    DOM.username.value="";
    DOM.object.value="";
    DOM.link.value="";
  },

  /* LOGOUT */
  logout: function(){
    location.reload();
  }
};

/* UI CONTROL */
const UI = {
  show: function(page){

    document.querySelectorAll(".section")
      .forEach(s=>s.style.display="none");

    document.getElementById(page).style.display="block";
  }
};

/* LOAD USERS */
function loadUsers(){
  onSnapshot(collection(db,"users"),snap=>{
    DOM.userList.innerHTML="";

    snap.forEach(d=>{
      DOM.userList.innerHTML += `
        <div class="card">👤 ${d.data().name}</div>
      `;
    });
  });
}

/* LOAD PROJECTS */
function loadProjects(){
  onSnapshot(collection(db,"projects"),snap=>{
    DOM.projectList.innerHTML="";

    snap.forEach(d=>{
      let p=d.data();

      DOM.projectList.innerHTML += `
        <div class="card">
          👤 ${p.username}<br>
          🧠 ${p.object}<br>
          🔗 <a href="${p.link}" target="_blank" style="color:#38bdf8">Open</a>
        </div>
      `;
    });
  });
}

/* INIT */
loadUsers();
loadProjects();

/* expose */
window.App = App;
window.UI = UI;

UI.show("dashboard");

</script>

</body>
</html>
