<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects System</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:#0b1220;
  color:white;
  padding:20px;
}

.container{
  max-width:850px;
  margin:auto;
}

/* FORM */
input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  background:#111827;
  color:white;
}

button{
  padding:10px 15px;
  background:#2563eb;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
  margin-top:10px;
}

/* CARD */
.card{
  background:#111827;
  padding:15px;
  margin-top:12px;
  border-radius:10px;
}

a{
  color:#38bdf8;
  text-decoration:none;
}

.small{
  color:#9ca3af;
  font-size:13px;
}
</style>

</head>

<body>

<div class="container">

<h2>➕ Add Project</h2>

<input id="username" placeholder="username">
<input id="object" placeholder="project title / object">
<input id="link" placeholder="project link (Vercel URL)">

<button onclick="addProject()">Add Project</button>

<h2 style="margin-top:30px;">📁 Projects</h2>

<div id="list"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔴 CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ➕ ADD PROJECT */
window.addProject = async function(){

  if(username.value=="" || object.value=="" || link.value=="") return;

  await addDoc(collection(db,"projects"),{
    username: username.value,
    object: object.value,
    link: link.value
  });

  username.value="";
  object.value="";
  link.value="";
};

/* 📥 LOAD PROJECTS */
function loadProjects(){

  onSnapshot(collection(db,"projects"),snap=>{

    list.innerHTML="";

    snap.forEach(d=>{
      let data = d.data();

      list.innerHTML += `
        <div class="card">
          <div class="small">👤 ${data.username}</div>
          <h3>${data.object}</h3><br>

          🔗 <a href="${data.link}" target="_blank">
            Open Project
          </a>
        </div>
      `;
    });

  });
}

loadProjects();

</script>

</body>
</html>
