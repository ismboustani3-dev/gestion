<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TeamDash UI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI, sans-serif;
}

body{
  background:#0b1220;
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#0f172a;
  padding:20px;
  position:fixed;
}

.logo{
  font-size:22px;
  font-weight:bold;
  margin-bottom:30px;
}

.menu div{
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  cursor:pointer;
  color:#aaa;
}

.menu .active{
  background:#2563eb;
  color:white;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
  width:100%;
}

/* TOP CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:#111827;
  padding:20px;
  border-radius:12px;
}

.card h3{
  color:#9ca3af;
  font-size:14px;
}

.card h1{
  margin-top:10px;
}

/* SERVER LIST */
.box{
  background:#111827;
  padding:20px;
  border-radius:12px;
}

.server{
  display:flex;
  justify-content:space-between;
  padding:12px;
  border-bottom:1px solid #1f2937;
}

.rps{
  color:#a855f7;
}
</style>

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">TeamDash</div>

  <div class="menu">
    <div class="active">Overview</div>
    <div>Management</div>
    <div>Team</div>
    <div>Tools</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <h2 style="margin-bottom:20px;">Overview</h2>

  <!-- CARDS -->
  <div class="cards">
    <div class="card">
      <h3>Total Servers</h3>
      <h1>15</h1>
    </div>

    <div class="card">
      <h3>Active RPS</h3>
      <h1>29</h1>
    </div>

    <div class="card">
      <h3>Stock RPS</h3>
      <h1>0</h1>
    </div>
  </div>

  <!-- SERVERS -->
  <div class="box">
    <h3 style="margin-bottom:15px;">My Infrastructure</h3>

    <div class="server">
      <span>s_wmn3_2225 (104.206.148.58)</span>
      <span class="rps">6 RPS</span>
    </div>

    <div class="server">
      <span>s_wmn3_2193 (57.131.4.157)</span>
      <span class="rps">3 RPS</span>
    </div>

    <div class="server">
      <span>s_wmn3_2088 (46.105.41.176)</span>
      <span class="rps">3 RPS</span>
    </div>

  </div>

</div>

</body>
</html>
