<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultra Admin Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#e5e7eb;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100vh;
  background:#111827;
  color:white;
  padding:20px;
}

.sidebar h2{
  color:#38bdf8;
  margin-bottom:30px;
}

.sidebar ul{
  list-style:none;
}

.sidebar li{
  padding:12px;
  background:#1f2937;
  margin-bottom:10px;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}

.sidebar li:hover{
  background:#374151;
}

/* TOPBAR */

.topbar{
  position:fixed;
  left:220px;
  right:0;
  top:0;
  height:60px;
  background:white;
  border-bottom:1px solid #d1d5db;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

#search{
  width:250px;
  padding:10px;
  border-radius:8px;
  border:1px solid #cbd5e1;
}

/* MAIN */

.main{
  margin-left:220px;
  margin-top:60px;
  padding:20px;
}

/* STATS */

.stats{
  display:flex;
  gap:20px;
  margin-bottom:20px;
}

.stat{
  flex:1;
  background:white;
  border-radius:10px;
  padding:20px;
  border:1px solid #d1d5db;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

/* ADD BOX */

.addBox{
  background:white;
  padding:20px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin-bottom:30px;
}

.addBox h3{
  margin-bottom:15px;
}

.addBox input{
  padding:10px;
  margin:5px;
  border:1px solid #cbd5e1;
  border-radius:8px;
}

.addBox button{
  padding:10px 20px;
  background:#38bdf8;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.addBox button:hover{
  opacity:0.9;
}

/* USERS LIST */

#list{
  display:flex;
  flex-wrap:wrap;
  gap:25px;
}

/* USER BOX */

.userBox{
  width:190px;
  min-height:250px;
  background:white;
  border:2px solid black;
  padding:10px;
}

/* USER TITLE */

.userTitle{
  font-weight:bold;
  margin-bottom:15px;
  border-bottom:1px solid #999;
  padding-bottom:5px;
}

/* PROJECT */

.projectItem{
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px solid #ddd;
}

.projectName{
  margin-bottom:8px;
}

/* BUTTONS */

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.smallBtn{
  padding:5px 8px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-size:12px;
}

.openBtn{
  background:#38bdf8;
  color:white;
}

.editBtn{
  background:#facc15;
}

.deleteBtn{
  background:#ef4444;
  color:white;
}

/* MOBILE */

@media(max-width:700px){

  .sidebar{
    width:100%;
    height:auto;
    position:relative;
  }

  .topbar{
    left:0;
    position:relative;
  }

  .main{
    margin-left:0;
    margin-top:0;
  }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <h2>⚡ Ultra Admin</h2>

  <ul>
    <li>Dashboard</li>
    <li>Users</li>
    <li>Projects</li>
    <li>Settings</li>
  </ul>

</div>

<!-- TOPBAR -->

<div class="topbar">

  <input
    type="text"
    id="search"
    placeholder="Search..."
  >

  <div>
    👤 admin
  </div>

</div>

<!-- MAIN -->

<div class="main">

  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      Users
      <br>
      <span id="totalUsers">0</span>
    </div>

    <div class="stat">
      Projects
      <br>
      <span id="totalProjects">0</span>
    </div>

  </div>

  <!-- ADD PROJECT -->

  <div class="addBox">

    <h3>Add Project</h3>

    <input
      type="text"
      id="user"
      placeholder="Username"
    >

    <input
      type="text"
      id="name"
      placeholder="Project name"
    >

    <input
      type="text"
      id="link"
      placeholder="Project link"
    >

    <button id="addBtn">
      Add
    </button>

  </div>

  <!-- LIST -->

  <div id="list"></div>

</div>

<script>

/* GET DATA */

function getData(){

  let data =
    localStorage.getItem("projects");

  if(data){

    return JSON.parse(data);

  }

  return [];

}

/* SAVE DATA */

function saveData(data){

  localStorage.setItem(
    "projects",
    JSON.stringify(data)
  );

}

/* ADD PROJECT */

document
.getElementById("addBtn")
.onclick = function(){

  let user =
    document.getElementById("user")
    .value
    .trim();

  let name =
    document.getElementById("name")
    .value
    .trim();

  let link =
    document.getElementById("link")
    .value
    .trim();

  if(
    user === "" ||
    name === "" ||
    link === ""
  ){

    alert("Fill all fields");

    return;

  }

  if(!link.startsWith("http")){

    link = "https://" + link;

  }

  let data = getData();

  data.push({

    id: Date.now(),

    user: user,

    name: name,

    link: link

  });

  saveData(data);

  /* CLEAR */

  document.getElementById("user").value = "";
  document.getElementById("name").value = "";
  document.getElementById("link").value = "";

  /* REFRESH */

  render();

};

/* DELETE */

function delProject(id){

  let data = getData();

  data = data.filter(function(p){

    return p.id !== id;

  });

  saveData(data);

  render();

}

/* EDIT */

function editProject(id){

  let data = getData();

  let project =
    data.find(function(p){

      return p.id === id;

    });

  let newName =
    prompt(
      "Edit project name",
      project.name
    );

  if(newName){

    project.name = newName;

  }

  let newLink =
    prompt(
      "Edit project link",
      project.link
    );

  if(newLink){

    if(!newLink.startsWith("http")){

      newLink = "https://" + newLink;

    }

    project.link = newLink;

  }

  saveData(data);

  render();

}

/* STATS */

function updateStats(data){

  let users =
    new Set(
      data.map(function(p){

        return p.user;

      })
    );

  document.getElementById(
    "totalUsers"
  ).innerText = users.size;

  document.getElementById(
    "totalProjects"
  ).innerText = data.length;

}

/* RENDER */

function render(){

  let data = getData();

  let search =
    document.getElementById("search")
    .value
    .toLowerCase();

  let filtered =
    data.filter(function(p){

      return (

        p.user.toLowerCase().includes(search)

        ||

        p.name.toLowerCase().includes(search)

      );

    });

  updateStats(filtered);

  let grouped = {};

  filtered.forEach(function(p){

    if(!grouped[p.user]){

      grouped[p.user] = [];

    }

    grouped[p.user].push(p);

  });

  let html = "";

  for(let user in grouped){

    html += `

      <div class="userBox">

        <div class="userTitle">

          ${user}

        </div>

    `;

    grouped[user].forEach(function(p){

      html += `

        <div class="projectItem">

          <div class="projectName">

            ${p.name}

          </div>

          <div class="actions">

            <a
              href="${p.link}"
              target="_blank"
            >

              <button class="smallBtn openBtn">

                OPEN

              </button>

            </a>

            <button
              class="smallBtn editBtn"
              onclick="editProject(${p.id})"
            >

              Edit

            </button>

            <button
              class="smallBtn deleteBtn"
              onclick="delProject(${p.id})"
            >

              Delete

            </button>

          </div>

        </div>

      `;

    });

    html += `

      </div>

    `;

  }

  document.getElementById("list").innerHTML =
    html;

}

/* SEARCH */

document
.getElementById("search")
.addEventListener(
  "keyup",
  render
);

/* START */

render();

</script>

</body>
</html>
