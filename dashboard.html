<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects Dashboard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{background:#0b1220;color:white;display:flex}

/* SIDEBAR */
.sidebar{
  width:240px;height:100vh;background:#0f172a;
  padding:20px;position:fixed;
}
.menu div{
  padding:12px;margin:8px 0;border-radius:10px;
  cursor:pointer;color:#9ca3af;
}
.menu div:hover{background:#1f2937;color:white}
.menu .active{background:#2563eb;color:white}

/* MAIN */
.main{margin-left:240px;padding:20px;width:100%}

/* BOX */
.box{
  background:#111827;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
}

/* INPUT */
input{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* CARD */
.project{
  background:#0f172a;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}

.project a{
  color:#38bdf8;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Projects</h2>

  <div class="menu">
    <div class="active">📁 Projects</div>
  </div>
</div>

<div class="main">

<h2>Create Project</h2>

<div class="box">

  <input id="username" placeholder="username">
  <input id="object" placeholder="project object">
  <input id="link" placeholder="project link (vercel url)">

  <button onclick="addProject()">Add Project</button>

</div>

<h2>All Projects</h2>

<div id="list"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔴 CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ➕ ADD PROJECT */
window.addProject = async function(){

  if(username.value=="" || object.value=="" || link.value=="") return;

  await addDoc(collection(db,"projects"),{
    username: username.value,
    object: object.value,
    link: link.value
  });

  username.value="";
  object.value="";
  link.value="";
};

/* 📥 LOAD PROJECTS */
function loadProjects(){

  onSnapshot(collection(db,"projects"),snap=>{

    list.innerHTML="";

    snap.forEach(d=>{
      let data = d.data();

      list.innerHTML += `
        <div class="project">
          <b>👤 ${data.username}</b><br>
          🧠 ${data.object}<br><br>

          🔗 
          <a href="${data.link}" target="_blank">
            Open Project
          </a>

          <br><br>
          <button onclick="deleteProject('${d.id}')">Delete</button>
        </div>
      `;
    });

  });
}

/* ❌ DELETE */
window.deleteProject = async function(id){
  await deleteDoc(doc(db,"projects",id));
};

loadProjects();

</script>

</body>
</html>
