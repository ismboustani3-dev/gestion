<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team System Fixed</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:#0b1220;
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#0f172a;
  padding:20px;
  position:fixed;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:20px;
  font-weight:bold;
  margin-bottom:20px;
}

.menu{
  flex:1;
}

.menu div{
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
  color:#9ca3af;
}

.menu div:hover{
  background:#1f2937;
  color:white;
}

/* LOGOUT */
.logout{
  padding:12px;
  margin-top:auto;
  border-radius:10px;
  cursor:pointer;
  background:#1f2937;
  color:#ef4444;
  text-align:center;
  user-select:none;
}

.logout:hover{
  background:#dc2626;
  color:white;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
  width:100%;
}

/* BOX */
.box{
  background:#111827;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
  background:#0f172a;
  color:white;
}

button{
  padding:10px 15px;
  background:#2563eb;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.card{
  background:#0f172a;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">TEAM SYSTEM</div>

<div class="menu">
  <div onclick="UI.show('dashboard')">📊 Dashboard</div>
  <div onclick="UI.show('users')">👥 Users</div>
  <div onclick="UI.show('projects')">📁 Projects</div>
</div>

<div class="logout" id="logoutBtn">🚪 Logout</div>

</div>

<!-- MAIN -->
<div class="main">

<div id="dashboard" class="section active">
  <h2>Dashboard</h2>
</div>

<div id="users" class="section">
  <h2>Users</h2>
  <div class="box">
    <input id="uName" placeholder="username">
    <button onclick="App.addUser()">Add</button>
    <div id="userList"></div>
  </div>
</div>

<div id="projects" class="section">
  <h2>Projects</h2>
  <div class="box">
    <input id="username" placeholder="username">
    <input id="object" placeholder="project name">
    <input id="link" placeholder="link">
    <button onclick="App.addProject()">Add</button>
    <div id="projectList"></div>
  </div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* DOM */
const DOM = {
  uName: document.getElementById("uName"),
  username: document.getElementById("username"),
  object: document.getElementById("object"),
  link: document.getElementById("link"),
  userList: document.getElementById("userList"),
  projectList: document.getElementById("projectList"),
  logoutBtn: document.getElementById("logoutBtn")
};

/* APP */
const App = {

  addUser: async function(){
    if(!DOM.uName.value) return;

    await addDoc(collection(db,"users"),{
      name: DOM.uName.value
    });

    DOM.uName.value="";
  },

  addProject: async function(){
    if(!DOM.username.value || !DOM.object.value || !DOM.link.value) return;

    await addDoc(collection(db,"projects"),{
      username: DOM.username.value,
      object: DOM.object.value,
      link: DOM.link.value
    });

    DOM.username.value="";
    DOM.object.value="";
    DOM.link.value="";
  },

  logout: function(){
    alert("Logged out");
    location.reload();
  }

};

/* UI */
const UI = {
  show: function(page){

    document.querySelectorAll(".section")
      .forEach(s=>s.classList.remove("active"));

    document.getElementById(page).classList.add("active");
  }
};

/* LISTENERS */
DOM.logoutBtn.addEventListener("click", App.logout);

/* LOAD USERS */
onSnapshot(collection(db,"users"),snap=>{
  DOM.userList.innerHTML="";
  snap.forEach(d=>{
    DOM.userList.innerHTML += `<div class="card">👤 ${d.data().name}</div>`;
  });
});

/* LOAD PROJECTS */
onSnapshot(collection(db,"projects"),snap=>{
  DOM.projectList.innerHTML="";
  snap.forEach(d=>{
    let p=d.data();
    DOM.projectList.innerHTML += `
      <div class="card">
        👤 ${p.username}<br>
        🧠 ${p.object}<br>
        🔗 <a href="${p.link}" target="_blank" style="color:#38bdf8">Open</a>
      </div>
    `;
  });
});

window.App = App;
window.UI = UI;

</script>

</body>
</html>
