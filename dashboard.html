<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi User Projects</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:#0b1220;
  color:white;
  padding:20px;
}

/* LOGIN SIMPLE */
#login{
  max-width:400px;
  margin:auto;
  margin-top:80px;
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  background:#111827;
  color:white;
}

button{
  padding:10px;
  background:#2563eb;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

/* TABLES */
.table{
  background:#111827;
  padding:15px;
  margin-top:20px;
  border-radius:10px;
}

.user-title{
  color:#38bdf8;
  margin-bottom:10px;
}

.card{
  background:#0f172a;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
}

a{
  color:#38bdf8;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Login</h2>
  <input id="user" placeholder="username">
  <button onclick="login()">Enter</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<h2>Projects Dashboard</h2>

<div id="tables"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = "";

/* LOGIN */
window.login = function(){

  if(user.value=="") return;

  currentUser = user.value;

  login.style.display="none";
  appDiv.style.display="block";

  loadProjects();
};

/* LOAD PROJECTS GROUPED BY USER */
function loadProjects(){

  onSnapshot(collection(db,"projects"),snap=>{

    let dataByUser = {};

    snap.forEach(d=>{
      let p = d.data();

      if(!dataByUser[p.username]){
        dataByUser[p.username] = [];
      }

      dataByUser[p.username].push(p);
    });

    renderTables(dataByUser);

  });
}

/* RENDER TABLES */
function renderTables(data){

  tables.innerHTML="";

  for(let user in data){

    // optional: show only current user
    if(user !== currentUser) continue;

    let projects = data[user];

    let html = `
      <div class="table">
        <div class="user-title">👤 ${user}</div>
    `;

    projects.forEach(p=>{
      html += `
        <div class="card">
          🧠 ${p.object}<br>
          🔗 <a href="${p.link}" target="_blank">Open</a>
        </div>
      `;
    });

    html += `</div>`;

    tables.innerHTML += html;
  }
}

</script>

</body>
</html>
