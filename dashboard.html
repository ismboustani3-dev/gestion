<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Pro Admin Dashboard</title>

<style>

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at top,#0a0f1c,#050814);
  color:white;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:240px;
  height:100vh;
  background: rgba(17,24,39,0.65);
  backdrop-filter: blur(15px);
  padding:20px;
  border-right:1px solid rgba(255,255,255,0.08);
}

.sidebar h2{
  color:#38bdf8;
}

/* TOPBAR */

.topbar{
  position:fixed;
  top:0;
  left:240px;
  right:0;
  height:60px;
  background: rgba(17,24,39,0.5);
  backdrop-filter: blur(15px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

/* SEARCH */

#search{
  padding:8px;
  border-radius:8px;
  border:none;
  background:#111827;
  color:white;
  width:220px;
}

/* MAIN */

.main{
  margin-left:240px;
  margin-top:60px;
  padding:20px;
}

/* STATS */

.stats{
  display:flex;
  gap:15px;
}

.stat{
  flex:1;
  background: rgba(17,24,39,0.6);
  padding:18px;
  border-radius:15px;
  text-align:center;
  border:1px solid rgba(56,189,248,0.2);
}

/* ADD BOX */

.card{
  background: rgba(17,24,39,0.6);
  backdrop-filter: blur(10px);
  padding:15px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,0.08);
  margin-top:20px;
}

input,button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
}

input{
  background:#111827;
  color:white;
}

button{
  background:linear-gradient(45deg,#38bdf8,#0ea5e9);
  color:white;
  cursor:pointer;
}

/* USERS BOXES */

#list{
  display:flex;
  flex-wrap:wrap;
  gap:25px;
  margin-top:20px;
}

/* USER BOX */

.userBox{
  width:190px;
  min-height:260px;
  background:white;
  color:black;
  border:2px solid black;
  padding:10px;
}

/* USER TITLE */

.userTitle{
  font-weight:bold;
  margin-bottom:15px;
  border-bottom:1px solid #999;
  padding-bottom:5px;
}

/* PROJECT */

.projectItem{
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px solid #ddd;
}

.projectName{
  margin-bottom:8px;
}

/* ACTIONS */

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.smallBtn{
  padding:5px 8px;
  font-size:12px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.openBtn{
  background:#38bdf8;
  color:white;
}

.editBtn{
  background:#facc15;
  color:black;
}

.deleteBtn{
  background:#ef4444;
  color:white;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <h2>⚡ Ultra Admin</h2>

</div>

<!-- TOPBAR -->

<div class="topbar">

  <input
    id="search"
    placeholder="🔍 Search..."
    oninput="render()"
  >

  <div>
    👤 admin
  </div>

</div>

<!-- MAIN -->

<div class="main">

  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      👤 Users
      <br>
      <span id="totalUsers">0</span>
    </div>

    <div class="stat">
      📁 Projects
      <br>
      <span id="totalProjects">0</span>
    </div>

  </div>

  <!-- ADD -->

  <div class="card">

    <h3>➕ Add Project</h3>

    <input
      type="text"
      id="user"
      placeholder="Username"
    >

    <input
      type="text"
      id="name"
      placeholder="Project name"
    >

    <input
      type="text"
      id="link"
      placeholder="Project link"
    >

    <button
      type="button"
      onclick="addProject()"
    >
      Add
    </button>

  </div>

  <!-- LIST -->

  <div id="list"></div>

</div>

<script>

/* STORAGE */

function getData(){

  let data =
    localStorage.getItem("projects");

  if(data){

    return JSON.parse(data);

  }

  return [];

}

function saveData(data){

  localStorage.setItem(
    "projects",
    JSON.stringify(data)
  );

}

/* ADD PROJECT */

function addProject(){

  let user =
    document.getElementById("user").value.trim();

  let name =
    document.getElementById("name").value.trim();

  let link =
    document.getElementById("link").value.trim();

  if(user == "" || name == "" || link == ""){

    alert("Fill all fields");

    return;

  }

  if(link.indexOf("http") !== 0){

    link = "https://" + link;

  }

  let data = getData();

  data.push({

    id:new Date().getTime(),

    user:user,

    name:name,

    link:link

  });

  saveData(data);

  document.getElementById("user").value = "";
  document.getElementById("name").value = "";
  document.getElementById("link").value = "";

  render();

}

/* DELETE */

function delProject(id){

  let data =
    getData().filter(
      p => p.id !== id
    );

  saveData(data);

  render();

}

/* EDIT */

function editProject(id){

  let data = getData();

  let project =
    data.find(p => p.id === id);

  let newName =
    prompt(
      "Edit project name",
      project.name
    );

  if(newName){

    project.name = newName;

  }

  let newLink =
    prompt(
      "Edit project link",
      project.link
    );

  if(newLink){

    if(newLink.indexOf("http") !== 0){

      newLink = "https://" + newLink;

    }

    project.link = newLink;

  }

  saveData(data);

  render();

}

/* STATS */

function updateStats(data){

  let users =
    new Set(
      data.map(p => p.user)
    );

  document.getElementById(
    "totalUsers"
  ).innerText = users.size;

  document.getElementById(
    "totalProjects"
  ).innerText = data.length;

}

/* RENDER */

function render(){

  let data = getData();

  let q =
    document.getElementById("search")
    .value
    .toLowerCase();

  let filtered =
    data.filter(p =>

      p.user.toLowerCase().includes(q)

      ||

      p.name.toLowerCase().includes(q)

    );

  updateStats(filtered);

  let box =
    document.getElementById("list");

  box.innerHTML = "";

  let grouped = {};

  filtered.forEach(function(p){

    if(!grouped[p.user]){

      grouped[p.user] = [];

    }

    grouped[p.user].push(p);

  });

  for(let user in grouped){

    let html = "";

    grouped[user].forEach(function(p){

      html += `

        <div class="projectItem">

          <div class="projectName">

            ${p.name}

          </div>

          <div class="actions">

            <a
              href="${p.link}"
              target="_blank"
            >

              <button class="smallBtn openBtn">

                OPEN

              </button>

            </a>

            <button
              class="smallBtn editBtn"
              onclick="editProject(${p.id})"
            >

              Edit

            </button>

            <button
              class="smallBtn deleteBtn"
              onclick="delProject(${p.id})"
            >

              Delete

            </button>

          </div>

        </div>

      `;

    });

    box.innerHTML += `

      <div class="userBox">

        <div class="userTitle">

          👤 ${user}

        </div>

        ${html}

      </div>

    `;

  }

}

/* START */

render();

</script>

</body>
</html>
