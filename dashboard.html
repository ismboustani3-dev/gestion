<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, query, where, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;

/* 🔐 LOGIN */
window.login = async function(){
  let u = loginUser.value;
  let p = loginPass.value;

  const q = query(collection(db,"users"),
    where("username","==",u),
    where("password","==",p)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    alert("Wrong login ❌");
    return;
  }

  currentUser = u;

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  loadProjects();
};

/* 👤 CREATE USER */
window.addUser = async function(){
  if(userInput.value=="" || passInput.value=="") return;

  await addDoc(collection(db,"users"),{
    username: userInput.value,
    password: passInput.value
  });

  alert("User created ✅");

  userInput.value="";
  passInput.value="";
};

/* 📁 PROJECTS (per user) */
window.addProject = async function(){
  if(projectInput.value=="") return;

  await addDoc(collection(db,"projects"),{
    name: projectInput.value,
    owner: currentUser
  });

  projectInput.value="";
};

function loadProjects(){
  onSnapshot(collection(db,"projects"),snap=>{
    projectList.innerHTML="";

    snap.forEach(d=>{
      let data = d.data();

      if(data.owner === currentUser){
        projectList.innerHTML += `
          <div class="item">${data.name}</div>
        `;
      }
    });
  });
}

</script>
